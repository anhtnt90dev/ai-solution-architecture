name: Template request
description: Request a new architecture template, checklist, or scorecard.
title: "[Template]: "
labels: ["template", "needs-triage"]
body:
  - type: input
    id: template_name
    attributes:
      label: Template name
      placeholder: Example: Agent tool threat model
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe who will use it and during which architecture decision.
    validations:
      required: true
  - type: textarea
    id: fields
    attributes:
      label: Suggested fields
      description: List sections or fields that should be included.
    validations:
      required: false
